name: isp_router_toolkit
description: ISP Helper - network overview and router shortcuts for field technicians.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  network_info_plus: ^5.0.3
  connectivity_plus: ^6.0.3
  permission_handler: ">=11.3.1 <14.0.0"
  url_launcher: ^6.3.0
  flutter_secure_storage: ^9.2.2
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
